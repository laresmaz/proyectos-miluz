# CI entry point
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# One run per branch at a time, so main's runs finish in merge order and CD never applies an older commit last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.areas.outputs.frontend }}
      infra: ${{ steps.areas.outputs.infra }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history, so the branch can be compared with main.
          fetch-depth: 0
      # Only one developer, so require the latest main to catch semantic merge conflicts.
      - name: Branch includes the latest main
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git merge-base --is-ancestor origin/main "$HEAD_SHA" || {
            echo "::error::This branch is behind main. Run 'git pull origin main' (or rebase on main), then push again."
            exit 1
          }
      # On a PR, a part runs if its folder or the workflows changed
      - name: Changed parts
        id: areas
        run: |
          # Prints true if the PR touches the given folder or the workflows (always true outside PRs).
          changed() {
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo true; return; fi
            git diff --name-only origin/main...HEAD | grep -qE "^($1/|\.github/)" && echo true || echo false
          }
          echo "frontend=$(changed frontend)" >> "$GITHUB_OUTPUT"
          echo "infra=$(changed infra)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml
    secrets:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # "UI Tests" is required (adding chromatic skip for PRs that don't touch the frontend)
  ui-tests-skip:
    needs: changes
    if: needs.changes.outputs.frontend != 'true'
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - working-directory: frontend
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::warning::CHROMATIC_PROJECT_TOKEN is missing (or this is a fork PR), so \"UI Tests\" won't report and the PR can't merge."
            exit 0
          fi
          # The locked version, so this can't drift from the frontend's Chromatic and skips a slow install.
          npx --yes "chromatic@$(grep -oPm1 '^  chromatic@\K[0-9.]+(?=:)' pnpm-lock.yaml)" --skip

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/infra.yml
    # id-token lets the plan log in to Google with GitHub's token instead of a stored key.
    permissions:
      contents: read
      id-token: write
    secrets:
      TF_BILLING_ACCOUNT: ${{ secrets.TF_BILLING_ACCOUNT }}

  ci-ok:
    needs: [changes, frontend, ui-tests-skip, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          ! grep -qE "failure|cancelled" <<<"$RESULTS"
