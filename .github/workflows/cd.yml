# CD: applies the infrastructure, then deploys the frontend, after CI passes on main
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  infra-apply:
    # Only after a green CI run on a push to main, or from the manual button.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: infrastructure
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_ACCOUNT }}
      - run: terraform init -input=false
      - name: Apply
        env:
          TF_VAR_billing_account: ${{ secrets.TF_BILLING_ACCOUNT }}
        run: terraform apply -auto-approve -input=false -no-color

  # After infra-apply, so the site never deploys against infrastructure it doesn't have yet.
  frontend-deploy:
    needs: infra-apply
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: frontend-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_HOSTING_DEPLOY_ACCOUNT }}
      # The commit SHA as the release message, so Hosting's release history maps back to commits.
      - run: pnpm exec firebase deploy --only hosting --project proyectos-miluz --non-interactive --message "$(git rev-parse HEAD)"
      - name: Smoke test the live site
        run: bash smokeTest.sh
      # After the smoke test, so it audits the release just deployed, through the real CDN.
      - name: Lighthouse on the live site
        env:
          LIGHTHOUSE_URL: https://www.proyectosmiluz.com/
        run: pnpm lighthouse
