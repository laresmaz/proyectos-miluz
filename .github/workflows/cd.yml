# CD entry point: applies the infrastructure, then deploys the frontend, after CI passes on main
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  infra:
    # Only after a green CI run on a push to main, or from the manual button.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/infra-deployment.yml
    secrets:
      TF_BILLING_ACCOUNT: ${{ secrets.TF_BILLING_ACCOUNT }}

  # After infra, so the site never deploys against infrastructure it doesn't have yet.
  frontend:
    needs: infra
    uses: ./.github/workflows/frontend-deployment.yml
