# Frontend integration: format, lint, tests, builds, Chromatic and Lighthouse, called from ci.yml
name: Frontend integration

on:
  workflow_call:
    secrets:
      CHROMATIC_PROJECT_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Before Lighthouse, so a failed budget can't hide a broken Storybook.
      - run: pnpm build-storybook
      # Changes don't fail this job: Chromatic's own "UI Tests" check blocks the merge until they're approved.
      - name: Chromatic regression board
        continue-on-error: true
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::warning::CHROMATIC_PROJECT_TOKEN is missing (or this is a fork PR), so \"UI Tests\" won't report and the PR can't merge."
            exit 0
          fi
          pnpm exec chromatic --storybook-build-dir storybook-static --exit-zero-on-changes --auto-accept-changes main
      - run: pnpm lighthouse
      - name: Fetch main's Lighthouse numbers
        if: github.event_name == 'pull_request' && (success() || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name lighthouse-summary --dir baseline || echo "No numbers from main yet."
      - name: Lighthouse summary
        if: success() || failure()
        run: node lighthouseSummary.ts
      - name: Save the numbers for later PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-summary
          path: frontend/lighthouse-summary.json
          retention-days: 90
