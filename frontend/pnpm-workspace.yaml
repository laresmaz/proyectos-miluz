# pnpm settings for the frontend.
minimumReleaseAge: 10080 # Supply-chain guard: only version published at least 7 days ago in min.
# Install scripts stay blocked: esbuild gets its binary from an optional package, and the git hook is installed by our "prepare" script.
# firebase-tools runs without them: protobufjs's script only prints a version warning, and re2 is an optional native regex build.
allowBuilds:
  esbuild: false
  protobufjs: false
  re2: false
  simple-git-hooks: false
