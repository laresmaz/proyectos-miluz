<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 312" fill="#ffc20e" stroke="#ffc20e">
<!-- Tower crane in triangles -->
<defs>
  <!-- Cab window: white keeps the whole peak and cab, black cuts the window out -->
  <mask id="cab-window" stroke="none">
    <rect x="140" y="0" width="30" height="80" fill="#fff"/>
    <polygon points="155,55 165,55 167,60.7 167,74 155,74" fill="#000"/>
  </mask>
</defs>
<g stroke-width="0">
  <!-- Mast -->
  <g id="mast">
    <polygon points="170,87 140,87 170,102"/>
    <polygon points="140,97 170,112 140,127"/>
    <polygon points="170,122 140,137 170,152"/>
    <polygon points="140,147 170,162 140,177"/>
    <polygon points="170,172 140,187 170,202"/>
    <polygon points="140,197 170,212 140,227"/>
    <polygon points="170,222 140,237 170,252"/>
    <polygon points="140,247 170,262 140,277"/>
    <polygon points="170,272 140,287 170,302"/>
    <polygon points="140,297 170,312 140,312"/>
  </g>
  <!-- Peak and cab in one shape -->
  <polygon id="peak-cab" points="140,80 140,60 155,18 170,60 170,80" mask="url(#cab-window)"/>
  <!-- Jib -->
  <g id="jib">
    <polygon points="177,80 177.5,60 190,80"/>
    <polygon points="185,60 197.5,80 210,60"/>
    <polygon points="205,80 217.5,60 230,80"/>
    <polygon points="225,60 237.5,80 250,60"/>
    <polygon points="245,80 257.5,60 270,80"/>
    <polygon points="265,60 277.5,80 290,60"/>
    <polygon points="285,80 297.5,60 310,80"/>
    <polygon points="305,60 317.5,80 330,60"/>
    <polygon points="325,80 337.5,60 350,80"/>
  </g>
  <!-- Counter-jib -->
  <g id="counter-jib">
    <polygon points="72.5,60 72.5,80 85,80"/>
    <polygon points="80,60 92.5,80 105,60"/>
    <polygon points="100,80 112.5,60 125,80"/>
    <polygon points="133,60 133,80 120,60"/>
  </g>
  <!-- Counterweight -->
  <polygon id="counterweight" points="72.5,84 101.5,84 101.5,103 72.5,103"/>
  <!-- Hook block -->
  <polygon id="hook" points="314.1,170 320.9,170 324.5,175 319.5,182 315.5,182 310.5,175"/>
</g>
<!-- Cables -->
<g id="cables">
  <!-- Jib tie -->
  <polygon points="155,18 160.6,20.5 331.4,57 337.5,57 331.9,54.5 161.1,18" stroke="none"/>
  <!-- Counter-jib tie -->
  <polygon points="155,18 149,19.4 77.4,53.3 72.5,57 78.5,55.6 150.1,21.7" stroke="none"/>
  <!-- Hoist cable -->
  <polygon points="317.5,83 318.5,89 318.5,170 316.5,170 316.5,89" stroke="none"/>
</g>
</svg>
