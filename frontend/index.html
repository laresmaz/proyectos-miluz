<!doctype html>
<!-- Page shell: the Spanish title and description are what link previews (e.g. WhatsApp) show, since they don't run JavaScript. -->
<!-- The BUSINESS_NAME and BUSINESS_CITY markers (wrapped in % signs) are filled from src/config.ts by businessDetails.ts. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%BUSINESS_NAME% · Ingeniero civil, reformas y estructuras en %BUSINESS_CITY%</title>
    <meta
      name="description"
      content="Reformas, plomería, electricidad, albañilería, drywall y estructuras de concreto armado con respaldo de ingeniero. Escríbanos por WhatsApp."
    />
    <meta name="theme-color" content="#05054A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
